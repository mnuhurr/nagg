<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News</title>
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h1>News</h1>
<div id="list"></div>
<div id="sentinel"></div>
<div id="status"></div>

<script>
const LIMIT = 30;
let loading = false;
let done = false;
let lastPublishedAt = null;

const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');
const sentinel = document.getElementById('sentinel');

const CATEGORY_COLORS = [
      '#E63946', // red
      '#F4A261', // orange
      '#E9C46A', // yellow
      '#2A9D8F', // teal
      '#457B9D', // steel blue
      '#6D597A', // mauve
      '#B5838D', // dusty rose
      '#8AC926', // green
      '#1982C4', // blue
      '#6A4C93', // purple
      '#FF6B6B', // coral
      '#4D908E', // slate teal
      '#F9844A', // tangerine
      '#43AA8B', // sea green
      '#577590', // muted blue
      '#9B5DE5', // violet
    ];

function colorForCategory(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return CATEGORY_COLORS[Math.abs(hash) % CATEGORY_COLORS.length];
}

function renderItem(item) {
  const div = document.createElement('div');
  div.className = 'item';

  const h2 = document.createElement('h2');
  const a = document.createElement('a');
  a.href = item.itemLink;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = item.itemTitle;
  h2.appendChild(a);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const date = new Date(item.itemPubDate);
  meta.textContent = `${item.itemSourceName} · ${item.itemCategory} · ${date.toLocaleString()}`;

  const dot = document.createElement('span');
  dot.style.display = 'inline-block';
  dot.style.width = '9px';
  dot.style.height = '9px';
  dot.style.borderRadius = '20%';
  dot.style.backgroundColor = colorForCategory(item.itemCategory);
  dot.style.marginRight = '6px';
  meta.prepend(dot);

  const desc = document.createElement('div');
  desc.className = 'desc';
  desc.textContent = item.itemDescription || '';

  div.appendChild(h2);
  div.appendChild(meta);
  if (item.itemDescription) div.appendChild(desc);
  listEl.appendChild(div);
}

async function loadMore() {
  if (loading || done) return;
  loading = true;
  statusEl.textContent = 'Loading…';

  const params = new URLSearchParams({ limit: LIMIT });
  if (lastPublishedAt) params.set('before', lastPublishedAt);

  try {
    const res = await fetch(`/api/items?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const items = await res.json();

    if (items.length === 0) {
      done = true;
      statusEl.textContent = 'No more items.';
      return;
    }

    items.forEach(renderItem);
    lastPublishedAt = items[items.length - 1].itemPubDate;

    if (items.length < LIMIT) {
      done = true;
      statusEl.textContent = 'No more items.';
    } else {
      statusEl.textContent = '';
    }
  } catch (err) {
    statusEl.textContent = `Failed to load: ${err.message}`;
  } finally {
    loading = false;
  }
}

const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
});
observer.observe(sentinel);

loadMore();
</script>
</body>
</html>
